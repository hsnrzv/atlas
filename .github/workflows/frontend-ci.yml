name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only changes skip the browser jobs (e2e, performance, visual). `verify` always runs: it is fast and
  # Prettier also checks the Markdown. Skipped jobs report success, so the required checks still pass.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        run: bash .github/scripts/detect-code-changes.sh
        env:
          BEFORE: ${{ github.event.before }}

  verify:
    name: Design checks, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lockfile resolves only from the public npm registry
        run: npm run lockfile:check

      - name: Licence allow-list for the shipped dependency tree (F2-11)
        run: npm run licenses:check

      - name: Design system (tokens in sync, WCAG contrast, dimension icons, brand assets)
        run: npm run design:check

      - name: ESLint (TypeScript + templates incl. accessibility rules)
        run: npm run lint

      - name: Stylelint (no raw hex in components)
        run: npm run lint:styles

      - name: Prettier
        run: npm run format:check

      - name: Unit tests (Vitest)
        run: npm run test:ci

      - name: Production build (type-check + budgets)
        run: npm run build

      - name: Bundle guard (no mock data in the production bundle)
        run: npm run bundle:check

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/atlas-frontend/browser
          retention-days: 7

      - name: CycloneDX SBOM of the shipped npm tree (F2-11)
        run: npm run sbom

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-sbom
          path: dist/atlas-frontend.cdx.json
          retention-days: 30

  # The suite is CPU-bound (axe, four browser projects), so it runs as parallel shards, each on its own runner.
  # `e2e-result` reports the required check "Playwright smoke + axe" for all shards.
  e2e:
    name: Playwright shard ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned: Playwright's `install --with-deps` has no package list for Ubuntu 26.04 (the new
    # ubuntu-latest) yet and fails on removed font packages. Move back once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright
        run: npm run e2e -- --shard=${{ matrix.shard }}/3

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  e2e-result:
    name: Playwright smoke + axe
    needs: e2e
    # Runs even when a shard fails, so the required check fails instead of being skipped (skipped counts as passed).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed (or were skipped for a documentation-only change)
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "e2e shards: $RESULT"
          [[ "$RESULT" == "success" || "$RESULT" == "skipped" ]]

  performance:
    name: Core Web Vitals budgets (mid-range phone)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned: Playwright's `install --with-deps` has no package list for Ubuntu 26.04 (the new
    # ubuntu-latest) yet and fails on removed font packages. Move back once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Optimised build with the mock adapter, then measure LCP, TBT and CLS
        run: npm run e2e:performance

      - name: The bundle guard detects the mock (self-test on the mock build)
        run: node scripts/check-bundle-no-mock.mjs dist/atlas-performance/browser --expect-mock

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual regression (key pages, both themes)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Start the Linux Playwright browser server
        run: npm run e2e:visual:start
        env:
          ATLAS_CONTAINER_ENGINE: docker

      - name: Compare screenshots with the approved baselines
        run: npm run e2e:visual

      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: |
            playwright-report
            test-results
          retention-days: 7

  # GitHub supports dependency review on private repositories only with GitHub Advanced Security, which
  # personal accounts cannot enable. The job runs once the repository is public; Dependabot alerts cover
  # vulnerable dependencies until then.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
