name: frontend-container

# Builds, smoke-tests and scans the runtime image (F2-11). Publishing to ghcr.io/hsnrzv/atlas-frontend (immutable
# tags, provenance, signing) is added with the delivery pipeline (F2-12, atlas-infra ADR-0007); see atlas-infra
# docs/plan/PLAN-INFRASTRUCTURE-CICD.md.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - nginx/**
      - package.json
      - package-lock.json
      - angular.json
      - src/**
      - public/**
      - design/svg/**
      - .trivyignore
      - .github/workflows/frontend-container.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: atlas-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health, SPA fallback, security headers, API isolation)
        run: |
          docker run -d --name atlas-frontend -p 8080:8080 atlas-frontend:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/some/deep/link)" = 200
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/anything)" = 404
          test "$(docker inspect -f '{{.Config.User}}' atlas-frontend:ci)" != "root"

      - if: failure()
        run: docker logs atlas-frontend

      # Trivy (Apache-2.0), action pinned to the v0.36.0 commit and the scanner to a fixed version. Fixable critical
      # and high findings fail the job; an accepted finding goes into .trivyignore with a reason and an expiry date.
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: atlas-frontend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: CycloneDX SBOM of the image (OS packages and the bundle)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: atlas-frontend:ci
          format: cyclonedx
          output: atlas-frontend-image.cdx.json
          skip-setup-trivy: true

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-image-sbom
          path: atlas-frontend-image.cdx.json
          retention-days: 30
