name: frontend-container

# image (every PR and main, no push): builds, smoke-tests and scans the runtime image (F2-11: Trivy, fixable
# CRITICAL/HIGH fail, exceptions in .trivyignore) and uploads a CycloneDX image SBOM. Required check on `main`.
#
# On push to main only (F2-12, atlas-infra ADR-0007; same design as atlas-microservices backend-container, BE-2.4):
#   publish         pushes the immutable tag ghcr.io/hsnrzv/atlas-frontend:main-<12-char sha> with provenance
#                   (mode=max) and SBOM attestations, refuses to overwrite an existing tag, never pushes `latest`,
#                   and scans the published digest. Only this job has `packages: write`.
#   bump-infra-dev  opens or updates one PR in hsnrzv/atlas-infra that sets newTag + digest for the frontend image
#                   in environments/dev/kustomization.yaml, using a GitHub App installation token (repository
#                   variable ATLAS_INFRA_APP_CLIENT_ID, secret ATLAS_INFRA_APP_PRIVATE_KEY). Skipped with a
#                   warning until the variable is set. Enables auto-merge (squash) on the PR, so it merges once
#                   atlas-infra's required status checks pass.
# Releases (X.Y.Z on an already published digest) and staging/prod promotion are not part of this workflow.
# See atlas-infra docs/plan/PLAN-INFRASTRUCTURE-CICD.md.
#
# No path filter on pull_request: the job is a required status check, and a workflow skipped by a path filter never
# reports a status, which blocks the merge indefinitely. Instead the `changes` job skips the image job (and with it
# publish and the dev bump) for documentation-only changes; a job skipped by its `if` reports success.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: atlas-frontend:ci
  REGISTRY_IMAGE: ghcr.io/hsnrzv/atlas-frontend

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        run: bash .github/scripts/detect-code-changes.sh
        env:
          BEFORE: ${{ github.event.before }}

  image:
    name: Build and smoke-test image
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health, SPA fallback, security headers, API isolation)
        run: |
          docker run -d --name atlas-frontend -p 8080:8080 "$IMAGE"
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/some/deep/link)" = 200
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/anything)" = 404
          test "$(docker inspect -f '{{.Config.User}}' "$IMAGE")" != "root"

      - if: failure()
        run: docker logs atlas-frontend

      # Trivy (Apache-2.0), action pinned to the v0.36.0 commit and the scanner to a fixed version. Fixable critical
      # and high findings fail the job; an accepted finding goes into .trivyignore with a reason and an expiry date.
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: CycloneDX SBOM of the image (OS packages and the bundle)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: atlas-frontend-image.cdx.json
          skip-setup-trivy: true

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-image-sbom
          path: atlas-frontend-image.cdx.json
          retention-days: 30

  publish:
    name: Publish image to GHCR (main only)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          tag="main-${GITHUB_SHA::12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR does not enforce tag immutability, so the workflow does (ADR-0007): an existing tag is never overwritten.
      - name: Refuse to overwrite an existing tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$REGISTRY_IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::$REGISTRY_IMAGE:$TAG already exists; published tags are immutable"
            exit 1
          fi

      # Same Dockerfile and layer cache as the image job, which smoke-tested and scanned this commit; the build args
      # only set the OCI labels in the last layer.
      - name: Build and push (provenance + SBOM attestations)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      # Scans the published bytes. A failure here stops the dev bump PR, so the image is never deployed.
      - name: Scan published image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.REGISTRY_IMAGE }}@${{ steps.push.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          APP_CONFIGURED: ${{ vars.ATLAS_INFRA_APP_CLIENT_ID != '' }}
        run: |
          {
            echo "### Published"
            echo
            echo "\`$REGISTRY_IMAGE:$TAG@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$APP_CONFIGURED" != "true" ]]; then
            echo "::warning::ATLAS_INFRA_APP_CLIENT_ID is not set; no atlas-infra dev bump PR is opened"
          fi

  bump-infra-dev:
    name: Open atlas-infra dev bump PR
    needs: publish
    if: vars.ATLAS_INFRA_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # One bump at a time; a queued run replaces an older pending one.
    concurrency:
      group: bump-infra-dev-frontend
      cancel-in-progress: false
    env:
      INFRA_REPO: hsnrzv/atlas-infra
      BUMP_BRANCH: chore/bump-frontend-dev
      KUSTOMIZATION: environments/dev/kustomization.yaml
      TAG: ${{ needs.publish.outputs.tag }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: GitHub App token (atlas-infra only)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ATLAS_INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATLAS_INFRA_APP_PRIVATE_KEY }}
          owner: hsnrzv
          repositories: atlas-infra
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout atlas-infra
        uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: atlas-infra
          fetch-depth: 0

      - name: Update dev image and open or update the PR
        working-directory: atlas-infra
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^main-[0-9a-f]{12}$ ]] || { echo "::error::unexpected tag '$TAG'"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest '$DIGEST'"; exit 1; }

          select='.images[] | select(.name == strenv(REGISTRY_IMAGE))'
          current_tag() { yq "$select | .newTag" "$KUSTOMIZATION"; }

          # Never replace a newer commit with an older one (runs can finish out of order).
          if git ls-remote --exit-code --heads origin "$BUMP_BRANCH" >/dev/null; then
            git show "origin/$BUMP_BRANCH:$KUSTOMIZATION" > /tmp/branch-kustomization.yaml
            open_tag="$(yq "$select | .newTag" /tmp/branch-kustomization.yaml)"
          fi
          for existing in "$(current_tag)" "${open_tag:-}"; do
            if [[ "$existing" =~ ^main-([0-9a-f]{12})$ ]]; then
              status="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
                "repos/$GITHUB_REPOSITORY/compare/${GITHUB_SHA::12}...${BASH_REMATCH[1]}" --jq .status || echo unknown)"
              if [[ "$status" == "ahead" || "$status" == "identical" ]]; then
                echo "::notice::$existing is the same as or newer than $TAG; nothing to bump"
                exit 0
              fi
            fi
          done

          previous_digest="$(yq "$select | .digest // \"\"" "$KUSTOMIZATION")"
          previous="$(current_tag)${previous_digest:+@$previous_digest}"
          git switch -C "$BUMP_BRANCH" origin/main
          # yq drops blank lines; apply only the real change so the file keeps its formatting.
          yq "($select) |= (.newTag = strenv(TAG) | .digest = strenv(DIGEST))" "$KUSTOMIZATION" > /tmp/bumped.yaml
          diff -B "$KUSTOMIZATION" /tmp/bumped.yaml > /tmp/bump.diff || true
          [[ -s /tmp/bump.diff ]] && patch -s "$KUSTOMIZATION" < /tmp/bump.diff
          [[ "$(current_tag)" == "$TAG" && "$(yq "$select | .digest" "$KUSTOMIZATION")" == "$DIGEST" ]]
          git --no-pager diff
          git diff --exit-code --quiet && { echo "::notice::already at $TAG"; exit 0; }

          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -q -am "chore(dev): bump atlas-frontend to $TAG" \
            -m "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            -m "Image: $REGISTRY_IMAGE:$TAG@$DIGEST"
          git push --force origin "$BUMP_BRANCH"

          title="chore(dev): bump atlas-frontend to $TAG"
          body="$(cat <<BODY
          ## Summary

          Automated dev bump from \`$GITHUB_REPOSITORY\` \`frontend-container\` ([run]($RUN_URL)), ADR-0007.

          - Image: \`$REGISTRY_IMAGE:$TAG@$DIGEST\`
          - Source commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA
          - Published with provenance and SBOM attestations; Trivy scan of the published digest passed.

          ## Type of change

          - [x] Image promotion (tag/digest bump) — environment: \`dev\`

          Rollback target: \`$previous\` (revert this PR).
          BODY
          )"
          if [[ "$(gh pr list --repo "$INFRA_REPO" --head "$BUMP_BRANCH" --state open --json number --jq length)" -gt 0 ]]; then
            gh pr edit "$BUMP_BRANCH" --repo "$INFRA_REPO" --title "$title" --body "$body"
          else
            gh pr create --repo "$INFRA_REPO" --base main --head "$BUMP_BRANCH" --title "$title" --body "$body"
          fi

          # Dev only: GitHub merges once atlas-infra's required checks pass. Needs "Allow auto-merge" in atlas-infra.
          gh pr merge "$BUMP_BRANCH" --repo "$INFRA_REPO" --auto --squash --delete-branch \
            || echo "::warning::could not enable auto-merge on the atlas-infra dev bump PR; merge it manually"
