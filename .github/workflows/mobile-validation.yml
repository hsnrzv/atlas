name: mobile-validation

# Builds the Capacitor shells. Runs when the native projects, the native shell code or the Capacitor
# dependencies change (macOS minutes are expensive), on pull requests and on main alike, weekly (catches runner and
# Xcode image drift) and on demand. Not a required check, so the path filter cannot block a merge.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/app/core/native/**'
      - 'scripts/assets/**'
      - '.github/workflows/mobile-validation.yml'
  push:
    branches: [main]
    # Same list as pull_request.
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/app/core/native/**'
      - 'scripts/assets/**'
      - '.github/workflows/mobile-validation.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 8 (Android Gradle Plugin 8.13) requires JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci --no-audit --no-fund

      - name: Native assets match the brand masters
        run: npm run assets:validate

      - name: Web build
        run: npm run build

      - name: No mock data in the bundle
        run: npm run bundle:check

      - name: Capacitor sync
        run: npx cap sync android

      - name: Gradle (debug build, Android lint, unit tests)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Web build
        run: npm run build

      - name: No mock data in the bundle
        run: npm run bundle:check

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Xcode build (simulator, unsigned)
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
