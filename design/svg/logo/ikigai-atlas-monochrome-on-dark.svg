<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 283 64" width="283" height="64" role="img" aria-labelledby="ia-title">
  <title id="ia-title">IKIGAI ATLAS</title>
  <!-- Route: the whole life as one connected journey. -->
  <polygon points="32,11 49.2,19.28 53.45,37.9 41.55,52.82 22.45,52.82 10.55,37.9 14.8,19.28" fill="none" stroke="#F5F0E6" stroke-width="3.25" stroke-linejoin="round" />
  <!-- Seven waypoints = the seven Life Dimensions, clockwise from north:
       Career, Finance, Health, Love, Passion, Friendship, Family. -->
  <g fill="#F5F0E6">
    <circle cx="32" cy="11" r="4.5" />
    <circle cx="49.2" cy="19.28" r="4.5" />
    <circle cx="53.45" cy="37.9" r="4.5" />
    <circle cx="41.55" cy="52.82" r="4.5" />
    <circle cx="22.45" cy="52.82" r="4.5" />
    <circle cx="10.55" cy="37.9" r="4.5" />
    <circle cx="14.8" cy="19.28" r="4.5" />
  </g>
  <!-- Compass needle = the person and their purpose; north half emphasised. -->
  <path d="M32 18 38 33H26Z" fill="#F5F0E6" />
  <path d="M27 33H37L32 45Z" fill="none" stroke="#F5F0E6" stroke-width="2" stroke-linejoin="round" />
  <!-- Editable wordmark. Font dependency: Inter SemiBold (600), SIL OFL 1.1. Do not outline in this master. -->
  <text x="78" y="41.45" fill="#F5F0E6" font-family="Inter, 'Inter Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" textLength="203" lengthAdjust="spacing">IKIGAI ATLAS</text>
</svg>
