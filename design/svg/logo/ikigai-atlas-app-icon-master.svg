<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="ia-title">
  <title id="ia-title">IKIGAI ATLAS app icon</title>
  <!-- Full-bleed opaque square; platforms apply their own corner mask. No text. Symbol box 640px with a 192px inset,
       as in the Figma app-icon master Atlas/V3/Brand/App icon Theme=Dark (160px symbol, 48px inset on 256px, exported at 4x). -->
  <rect width="1024" height="1024" fill="#0B1020" />
  <g transform="translate(512 512) scale(10) translate(-32 -32)">
    <!-- Cardinal Ikigai Venn (Figma V3 Atlas/V3/Brand/Symbol): four r19.2 circles on a 64 grid, centres N/W/E/S;
         the shared centre is formed by overlap only. Source: Figma "15.Export Assets", scaled 0.4 from 160px. -->
    <g>
      <circle cx="32" cy="20.8" r="19.2" fill="#5685B5" opacity="0.82" style="mix-blend-mode:screen" />
      <circle cx="20.8" cy="32" r="19.2" fill="#348F84" opacity="0.82" style="mix-blend-mode:screen" />
      <circle cx="43.2" cy="32" r="19.2" fill="#8A73BB" opacity="0.82" style="mix-blend-mode:screen" />
      <circle cx="32" cy="43.2" r="19.2" fill="#B17D9E" opacity="0.82" style="mix-blend-mode:screen" />
    </g>
  </g>
</svg>
