<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 102" width="220" height="102" role="img" aria-labelledby="ia-title">
  <title id="ia-title">IKIGAI ATLAS</title>
  <g transform="translate(78 0)">
    <!-- Cardinal Ikigai Venn (Figma V3 brand symbol): four r19.2 circles on a 64 grid, centres N/W/E/S;
         the shared centre is formed by overlap only. Source: Figma "15.Export Assets", scaled 0.4 from 160px. -->
    <g>
      <circle cx="32" cy="20.8" r="19.2" fill="#5685B5" opacity="0.82" style="mix-blend-mode:screen" />
      <circle cx="20.8" cy="32" r="19.2" fill="#348F84" opacity="0.82" style="mix-blend-mode:screen" />
      <circle cx="43.2" cy="32" r="19.2" fill="#8A73BB" opacity="0.82" style="mix-blend-mode:screen" />
      <circle cx="32" cy="43.2" r="19.2" fill="#B17D9E" opacity="0.82" style="mix-blend-mode:screen" />
    </g>
  </g>
  <!-- Editable wordmark. Font dependency: Inter SemiBold (600), SIL OFL 1.1. Do not outline in this master. -->
  <text x="110" y="97" fill="#F5F0E6" font-family="Inter, 'Inter Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" textLength="203" lengthAdjust="spacing" text-anchor="middle">IKIGAI ATLAS</text>
</svg>
