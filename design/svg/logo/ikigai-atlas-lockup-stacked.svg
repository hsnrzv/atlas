<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 138" width="172" height="138" role="img" aria-labelledby="ia-title">
  <title id="ia-title">IKIGAI ATLAS</title>
  <g transform="translate(38 0) scale(1.5)">
    <!-- Cardinal Ikigai Venn (Figma V3 Atlas/V3/Brand/Symbol): four r19.2 circles on a 64 grid, centres N/W/E/S;
         the shared centre is formed by overlap only. Source: Figma "15.Export Assets", scaled 0.4 from 160px. -->
    <g>
      <circle cx="32" cy="20.8" r="19.2" fill="#5685B5" opacity="0.72" style="mix-blend-mode:multiply" />
      <circle cx="20.8" cy="32" r="19.2" fill="#348F84" opacity="0.72" style="mix-blend-mode:multiply" />
      <circle cx="43.2" cy="32" r="19.2" fill="#8A73BB" opacity="0.72" style="mix-blend-mode:multiply" />
      <circle cx="32" cy="43.2" r="19.2" fill="#B17D9E" opacity="0.72" style="mix-blend-mode:multiply" />
    </g>
  </g>
  <!-- Editable wordmark (Figma Atlas/V3/Wordmark): Manrope Bold 700, 22/30, +1 px tracking, SIL OFL 1.1. Do not outline in this master. -->
  <text x="86" y="131.4" fill="#1D2935" font-family="'Manrope Variable', Manrope, 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" text-anchor="middle">IKIGAI ATLAS</text>
</svg>
