<!-- Wireframe — not a pixel spec; tokens are the source of truth (design/tokens/*.json). -->
<!-- IKIGAI ATLAS application shell, 390 × 844. Static, editable, low/mid-fidelity (design-instructions §6, §7.1).
     Colours: token hex values only. Text: live <text> (Inter → system sans fallback; DM Serif Display → Georgia).
     Icons: Tabler Icons v3.51.0 outline glyphs (MIT License, (c) Paweł Kuna), stroke 1.75, referenced via <use>.
     Sample content: the single illustrative mock Destination (design-instructions §14); values are placeholders. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="mock-title mock-desc" font-family="Inter, 'Inter Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="mock-title">IKIGAI ATLAS application shell — mobile wireframe (390 × 844)</title>
  <desc id="mock-desc">Mobile/Capacitor shell with top and bottom safe-area insets, a compact top app bar (symbol, My Atlas title, search, quick add, profile), stacked My Atlas content (greeting, next Waypoint hero, journey summary, Life Dimension carousel) and a navy bottom navigation with My Atlas (active), Destinations, Journey, Awards and More.</desc>
  <defs>
    <symbol id="brand-on-light" viewBox="0 0 64 64"><polygon points="32,11 49.2,19.28 53.45,37.9 41.55,52.82 22.45,52.82 10.55,37.9 14.8,19.28" fill="none" stroke="#14243A" stroke-width="3.25" stroke-linejoin="round" /><g fill="#14243A"><circle cx="32" cy="11" r="4.5" /><circle cx="49.2" cy="19.28" r="4.5" /><circle cx="53.45" cy="37.9" r="4.5" /><circle cx="41.55" cy="52.82" r="4.5" /><circle cx="22.45" cy="52.82" r="4.5" /><circle cx="10.55" cy="37.9" r="4.5" /><circle cx="14.8" cy="19.28" r="4.5" /></g><path d="M32 18 38 33H26Z" fill="#B88D52" /><path d="M26 33H38L32 46Z" fill="#304A65" /></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16l2 -6l6 -2l-2 6l-6 2" /><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M12 3l0 2" /><path d="M12 19l0 2" /><path d="M3 12l2 0" /><path d="M19 12l2 0" /></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9" /><path d="M5 21v-7" /></symbol>
    <symbol id="i-route" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4" /><path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5" /></symbol>
    <symbol id="i-award" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 0 12 0a6 6 0 1 0 -12 0" /><path d="M12 15l3.4 5.89l1.598 -3.233l3.598 .232l-3.4 -5.889" /><path d="M6.802 12l-3.4 5.89l3.598 -.233l1.598 3.232l3.4 -5.889" /></symbol>
    <symbol id="i-dots-vertical" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M11 19a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M11 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14" /><path d="M5 12l14 0" /></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -9" /><path d="M8 7v-2a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2" /><path d="M12 12l0 .01" /><path d="M3 13a20 20 0 0 0 18 0" /></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8v-3a1 1 0 0 0 -1 -1h-10a2 2 0 0 0 0 4h12a1 1 0 0 1 1 1v3m0 4v3a1 1 0 0 1 -1 1h-12a2 2 0 0 1 -2 -2v-12" /><path d="M20 12v4h-4a2 2 0 0 1 0 -4h4" /></symbol>
    <symbol id="i-heartbeat" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 13.572l-7.5 7.428l-2.896 -2.868m-6.117 -8.104a5 5 0 0 1 9.013 -3.022a5 5 0 1 1 7.5 6.572" /><path d="M3 13h2l2 3l2 -6l1 3h3" /></symbol>
  </defs>
  <rect x="0" y="0" width="390" height="844" fill="#FBF9F4" />
  <g id="content">
    <!-- Greeting and headline (display, mobile 36/42) — big picture first. -->
    <text x="16" y="136" font-size="16" fill="#4D5661">Good morning</text>
    <text x="16" y="178" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#252B33" letter-spacing="-0.36">Build the life</text>
    <text x="16" y="220" font-family="'DM Serif Display', Georgia, serif" font-size="36" fill="#252B33" letter-spacing="-0.36">you envision.</text>
    <text x="16" y="248" font-size="14" fill="#5F6873">Thu, 12 Nov 2026 · 1 active Destination</text>
    <!-- Next Waypoint before secondary analytics (design-instructions §7.1 mobile). -->
    <rect x="16" y="268" width="358" height="184" rx="16" fill="#101D32" />
    <path d="M296 332 C316 326 328 318 346 302" fill="none" stroke="#304A65" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7" />
    <circle cx="296" cy="332" r="4" fill="#304A65" />
    <circle cx="346" cy="302" r="6" fill="#D5AD70" />
    <text x="36" y="304" font-size="12" font-weight="600" fill="#D5AD70" letter-spacing="0.96">NEXT WAYPOINT</text>
    <text x="36" y="334" font-size="22" font-weight="600" fill="#F5F0E6">Submit application</text>
    <circle cx="41" cy="353" r="5" fill="#759ECA" />
    <text x="54" y="358" font-size="14" fill="#D4D8DC">Career · Master's degree in CS / AI</text>
    <rect x="36" y="372" width="196" height="6" rx="3" fill="#304A65" />
    <rect x="36" y="372" width="78" height="6" rx="3" fill="#759ECA" />
    <text x="244" y="379" font-size="12" fill="#D4D8DC">2 of 5 Steps done</text>
    <rect x="36" y="392" width="318" height="44" rx="8" fill="#D5AD70" />
    <text x="195" y="419" font-size="14" font-weight="600" fill="#101D32" text-anchor="middle">Explore next waypoint</text>
    <!-- Stacked journey summary. -->
    <rect x="16" y="468" width="358" height="72" rx="12" fill="#FFFFFF" stroke="#EAE2D4" />
    <text x="32" y="500" font-size="20" font-weight="600" fill="#252B33">1</text>
    <text x="32" y="522" font-size="11" fill="#5F6873">Active Destination</text>
    <text x="151.33" y="500" font-size="20" font-weight="600" fill="#252B33">0 of 7</text>
    <text x="151.33" y="522" font-size="11" fill="#5F6873">Waypoints done</text>
    <line x1="135.83" y1="484" x2="135.83" y2="524" stroke="#E5E7E8" stroke-width="1" />
    <text x="270.67" y="500" font-size="20" font-weight="600" fill="#252B33">Dec 2026</text>
    <text x="270.67" y="522" font-size="11" fill="#5F6873">Next deadline</text>
    <line x1="255.17" y1="484" x2="255.17" y2="524" stroke="#E5E7E8" stroke-width="1" />
    <!-- Life Dimensions as a horizontal carousel (third card intentionally cut off to signal scrolling). -->
    <text x="16" y="572" font-size="18" font-weight="600" fill="#252B33">Life Dimensions</text>
    <text x="374" y="572" font-size="14" font-weight="500" fill="#203650" text-anchor="end" text-decoration="underline">View all</text>
    <g id="dimension-career">
      <rect x="16" y="586" width="128" height="104" rx="12" fill="#FFFFFF" stroke="#EAE2D4" />
      <circle cx="46" cy="616" r="16" fill="#EAF1F8" />
      <use href="#i-briefcase" x="36" y="606" width="20" height="20" stroke="#426D9B" />
      <text x="30" y="654" font-size="14" font-weight="600" fill="#252B33">Career</text>
      <text x="30" y="672" font-size="12" fill="#5F6873">1 Destination</text>
      <rect x="30" y="678" width="100" height="6" rx="3" fill="#F0F1F1" />
      <rect x="30" y="678" width="20" height="6" rx="3" fill="#426D9B" />
    </g>
    <g id="dimension-finance">
      <rect x="156" y="586" width="128" height="104" rx="12" fill="#FFFFFF" stroke="#EAE2D4" />
      <circle cx="186" cy="616" r="16" fill="#F6EFE3" />
      <use href="#i-wallet" x="176" y="606" width="20" height="20" stroke="#805B2F" />
      <text x="170" y="654" font-size="14" font-weight="600" fill="#252B33">Finance</text>
      <text x="170" y="672" font-size="12" fill="#5F6873">None yet</text>
      <rect x="170" y="678" width="100" height="6" rx="3" fill="#F0F1F1" />
    </g>
    <g id="dimension-health">
      <rect x="296" y="586" width="128" height="104" rx="12" fill="#FFFFFF" stroke="#EAE2D4" />
      <circle cx="326" cy="616" r="16" fill="#EDF3EE" />
      <use href="#i-heartbeat" x="316" y="606" width="20" height="20" stroke="#52765B" />
      <text x="310" y="654" font-size="14" font-weight="600" fill="#252B33">Health</text>
      <text x="310" y="672" font-size="12" fill="#5F6873">None yet</text>
      <rect x="310" y="678" width="100" height="6" rx="3" fill="#F0F1F1" />
    </g>
    <text x="16" y="720" font-size="18" font-weight="600" fill="#252B33">Next Waypoints</text>
    <!-- List continues under the bottom navigation (content scrolls; padding-bottom = nav + safe area). -->
    <rect x="16" y="732" width="358" height="120" rx="12" fill="#FFFFFF" stroke="#EAE2D4" />
  </g>
  <g id="status-bar">
    <!-- Status bar / safe-area-inset-top (47px on this device class; CSS var safe-area-top). -->
    <rect x="0" y="0" width="390" height="47" fill="#FBF9F4" />
    <text x="32" y="31" font-size="15" font-weight="600" fill="#252B33">9:41</text>
    <text x="374" y="31" font-size="11" fill="#5F6873" text-anchor="end">safe area</text>
    <line x1="0" y1="46.5" x2="390" y2="46.5" stroke="#D4D8DC" stroke-width="1" stroke-dasharray="4 4" />
  </g>
  <g id="top-app-bar">
    <!-- Compact top app bar: 56px; brand symbol, page title, search, quick add, profile (44px targets). -->
    <rect x="0" y="47" width="390" height="56" fill="#FBF9F4" />
    <use href="#brand-on-light" x="16" y="61" width="28" height="28" />
    <text x="54" y="82" font-size="18" font-weight="600" fill="#252B33">My Atlas</text>
    <use href="#i-search" x="252" y="63" width="24" height="24" stroke="#4D5661" />
    <circle cx="308" cy="75" r="18" fill="#14243A" />
    <use href="#i-plus" x="298" y="65" width="20" height="20" stroke="#FFFFFF" />
    <circle cx="352" cy="75" r="16" fill="#F5F0E6" stroke="#EAE2D4" />
    <use href="#i-user" x="343" y="66" width="18" height="18" stroke="#4D5661" />
    <line x1="0" y1="102.5" x2="390" y2="102.5" stroke="#EAE2D4" stroke-width="1" />
  </g>
  <g id="bottom-navigation" data-surface="inverse">
    <!-- Bottom navigation: 64px + safe-area-inset-bottom; max five items (design-instructions §6.4).
         "More" opens Waypoints, Steps, Connections and Life Dimensions. -->
    <rect x="0" y="746" width="390" height="98" fill="#14243A" />
    <rect x="23" y="746" width="32" height="3" rx="1.5" fill="#D5AD70" />
    <rect x="11" y="754" width="56" height="32" rx="8" fill="#203650" />
    <use href="#i-compass" x="27" y="758" width="24" height="24" stroke="#F5F0E6" />
    <text x="39" y="802" font-size="11" font-weight="600" fill="#F5F0E6" text-anchor="middle">My Atlas</text>
    <use href="#i-flag" x="105" y="758" width="24" height="24" stroke="#D4D8DC" />
    <text x="117" y="802" font-size="11" font-weight="500" fill="#D4D8DC" text-anchor="middle">Destinations</text>
    <use href="#i-route" x="183" y="758" width="24" height="24" stroke="#D4D8DC" />
    <text x="195" y="802" font-size="11" font-weight="500" fill="#D4D8DC" text-anchor="middle">Journey</text>
    <use href="#i-award" x="261" y="758" width="24" height="24" stroke="#D4D8DC" />
    <text x="273" y="802" font-size="11" font-weight="500" fill="#D4D8DC" text-anchor="middle">Awards</text>
    <use href="#i-dots-vertical" x="339" y="758" width="24" height="24" stroke="#D4D8DC" />
    <text x="351" y="802" font-size="11" font-weight="500" fill="#D4D8DC" text-anchor="middle">More</text>
    <!-- safe-area-inset-bottom (34px): keep interactive content above this line. -->
    <line x1="0" y1="810.5" x2="390" y2="810.5" stroke="#304A65" stroke-width="1" stroke-dasharray="4 4" />
    <rect x="128" y="831" width="134" height="5" rx="2.5" fill="#F5F0E6" />
    <text x="374" y="832" font-size="11" fill="#D4D8DC" text-anchor="end">safe area</text>
  </g>
</svg>
