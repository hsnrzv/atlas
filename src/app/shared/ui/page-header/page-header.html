<div class="text">
  <ng-content select="atlas-breadcrumbs" />
  @if (level() === 1) {
    <h1>{{ title() }}</h1>
  } @else {
    <h2 class="atlas-h1">{{ title() }}</h2>
  }
  @if (description(); as description) {
    <p class="description">{{ description }}</p>
  }
</div>
<div class="actions">
  <ng-content select="[pageHeaderAction]" />
</div>
