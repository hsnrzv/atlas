<atlas-icon class="icon" [name]="icon()" size="lg" />
<h2 class="title">{{ title() }}</h2>
@if (description(); as description) {
  <p class="description">{{ description }}</p>
}
@if (kind() === 'loading') {
  <atlas-skeleton [lines]="3" />
} @else {
  <div class="action">
    <ng-content />
  </div>
}
