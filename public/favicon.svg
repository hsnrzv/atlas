<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="ia-title">
  <title id="ia-title">IKIGAI ATLAS</title>
  <style>
    .c { mix-blend-mode: multiply; opacity: 0.72; }
    @media (prefers-color-scheme: dark) {
      .c { mix-blend-mode: screen; opacity: 0.82; }
    }
  </style>
  <!-- Cardinal Ikigai Venn (Figma V3 brand symbol): four r19.2 circles on a 64 grid, centres N/W/E/S;
       the shared centre is formed by overlap only. Source: Figma "15.Export Assets", scaled 0.4 from 160px. -->
  <g>
    <circle cx="32" cy="20.8" r="19.2" fill="#5685B5" class="c" />
    <circle cx="20.8" cy="32" r="19.2" fill="#348F84" class="c" />
    <circle cx="43.2" cy="32" r="19.2" fill="#8A73BB" class="c" />
    <circle cx="32" cy="43.2" r="19.2" fill="#B17D9E" class="c" />
  </g>
</svg>
