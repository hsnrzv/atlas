# IKIGAI ATLAS frontend: static SPA served by nginx-unprivileged (non-root, port 8080).
# Routing of /api/ to the backend happens at the edge (local compose `edge` / Kubernetes ingress),
# never here, so this image stays environment-agnostic.
server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # Liveness/readiness probe for compose and Kubernetes.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed build output (outputHashing: all) never changes: cache for a year.
  location ~* "^/(?:main|chunk|polyfills|styles)-[A-Z0-9]{8}\.(?:js|css)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /media/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Unknown API calls must not fall back to index.html (would hide routing mistakes).
  location /api/ {
    return 404;
  }

  # SPA fallback: deep links resolve to the Angular router; index.html is always revalidated.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
